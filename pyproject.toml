[project]
name = "ottoman-htr"
version = "0.1.0"
description = "Uncertainty-preserving geometric + fuzzy representation for Ottoman handwritten manuscript recognition (research prototype, Uni Bern DH Center)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "scipy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
